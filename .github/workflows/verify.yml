name: HOL-01 exact finite verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository checksums
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run exact affine certificate and snapshot check
        run: python3 hol01_certificate.py --check RESULTS.json
      - name: Run independent direct-permutation p=7 cross-check
        run: python3 independent_p7_permutation_check.py
      - name: Run finite-prime regression checks
        run: python3 finite_prime_regression_check.py --check FINITE_REGRESSION_RESULTS.json

  before-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No invented identifier
        run: |
          if grep -rIqE --exclude-dir=.github "0000-0000-0000-0000|zenodo\.XXXX" . ; then
            echo "::error::placeholder identifier found"; exit 1; fi
      - name: No positive RH claim marker
        run: |
          if grep -rIqE --exclude-dir=.github "RHClaimed ?= ?true" . ; then
            echo "::error::positive claim marker found"; exit 1; fi
      - name: No withdrawn all-level wording
        run: |
          if grep -Iq "applies verbatim to every step" README.md HOL01_NOTE.tex; then
            echo "::error::withdrawn tower claim found"; exit 1; fi
